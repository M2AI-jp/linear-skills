name: Package checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  skills:
    name: Skill package structure
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Check the package and its links
        run: |
          python - <<'PYCODE'
          from pathlib import Path
          import re

          # One file is the whole skill. Keep it that way.
          entry = Path('skills/linear-workflow/SKILL.md')
          text = entry.read_text()
          assert text.startswith('---\n'), entry
          frontmatter = text.split('---', 2)[1]
          assert 'name: linear-workflow\n' in frontmatter, entry
          assert 'description:' in frontmatter, entry
          assert [p for p in Path('skills').rglob('*') if p.is_file()] == [entry], \
              'the skill is one file; add nothing beside it without saying why in DESIGN.md'

          for path in [Path('README.md'), Path('AGENTS.md'), Path('DESIGN.md'), entry]:
              for target in re.findall(r'\]\(([^)]+)\)', path.read_text()):
                  if '://' in target or target.startswith('#'):
                      continue
                  assert (path.parent / target.split('#')[0]).exists(), (path, target)
          PYCODE
