name: Package checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  skills:
    name: Skill package structure
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Check packaged files and local links
        run: |
          python - <<'PYCODE'
          from pathlib import Path
          import re
          for name in ('linear', 'linear-refresh', 'linear-pm'):
              root = Path('skills') / name
              text = (root / 'SKILL.md').read_text()
              assert text.startswith('---\n'), root
              frontmatter = text.split('---', 2)[1]
              assert f'name: {name}\n' in frontmatter, root
              assert 'description:' in frontmatter, root
              assert (root / 'agents/openai.yaml').is_file(), root
          for path in [Path('README.md'), *Path('skills').rglob('*.md')]:
              for target in re.findall(r'\]\(([^)]+)\)', path.read_text()):
                  if '://' in target or target.startswith('#'):
                      continue
                  assert (path.parent / target.split('#')[0]).exists(), (path, target)
          PYCODE
