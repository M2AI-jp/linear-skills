name: accept
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  gate:
    # main's branch protection requires a check with this name; keep it so the gate is the required check.
    name: Skill package structure
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      # The Codex engine acceptance runs Codex itself against a scripted stand-in model; without the binary it is skipped.
      - run: npm install --global @openai/codex@0.163.0
      - run: skills/linear-workflow/harness gate "${{ github.event.pull_request.base.sha || github.event.before }}"
