# Codexの起動メタデータ。
#
# allow_implicit_invocation を false にしてあるので、名前を言わない依頼で
# 勝手に選ばれることはない。使うときは $linear-workflow と明示する。
#
# 「使う場面で名前を言われなくても選ばれる」状態にしたくなったら、ここを
# true にする。それが起動制御の正しい置き場所で、プロンプトを傍受するHook
# ではない。true にする前に、意図しない場面で選ばれないかを実際の依頼で
# 確かめる。
interface:
  display_name: "Linear Workflow"
  short_description: "Linearで追跡している仕事を、計画・実行・確認・引継ぎまで進める"
  default_prompt: "$linear-workflow を使い、対象のLinear Projectまたは Issue を読んで現在地を確かめてから、依頼された範囲を進めてください。読むだけの依頼なら読んで答えてください。"
policy:
  allow_implicit_invocation: false
